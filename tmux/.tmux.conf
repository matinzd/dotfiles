unbind r
bind r source-file ~/.tmux.conf

# Pane borders
set -g pane-border-lines single
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# Show pane numbers when selecting
set -g display-panes-time 1200
set -g display-panes-active-colour colour39
set -g display-panes-colour colour245

# Put the pane title at the top
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_title} "

# Automatically use the current command as the title
set -g set-titles on

# Set C-a as command keybind
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Splitting
bind | split-window -h
bind - split-window -v

# act like vim
setw -g mode-keys vi
bind x kill-pane

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'dracula/tmux'

# Dracula Theme
set -g @dracula-cpu-usage-colors "dark_purple white"
set -g @dracula-network-bandwidth-colors "gray white"

# Dracula configs
set -g @dracula-show-powerline true
set -g @dracula-show-fahrenheit false
set -g @dracula-fixed-location "Stockholm, Sweden"
set -g @dracula-plugins "weather cpu-usage network-bandwidth ssh-session ram-usage battery"
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-ram-usage-label " "
set -g @dracula-show-battery-status true
set -g @dracula-battery-label false

# Tmux config
set -g status-position top
set -g mouse on

run '~/.tmux/plugins/tpm/tpm'

